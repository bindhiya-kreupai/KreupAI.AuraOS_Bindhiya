# Pull Request Checks
# Runs on every PR targeting main or develop.
# Performs PR-specific quality gates beyond the standard CI pipeline:
#   - Bundle size comparison vs base branch
#   - TypeScript type coverage check
#   - Prisma schema validation
#   - Migration safety check (no destructive changes without explicit annotation)

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress PR checks when new commits arrive
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ============================================================================
  # BUNDLE SIZE COMPARISON
  # Compare bundle size of this PR against the base branch
  # ============================================================================
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aura/database prisma generate

      - name: Build PR branch
        run: pnpm --filter web build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          JWT_SECRET: mock_jwt_secret_for_build_verification_minimum_32_chars

      - name: Capture PR bundle size
        id: pr-size
        run: |
          PR_SIZE=$(du -sb apps/web/.next | cut -f1)
          echo "size=$PR_SIZE" >> $GITHUB_OUTPUT
          echo "PR bundle size: $(du -sh apps/web/.next | cut -f1)"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base-branch

      - name: Install base branch deps
        run: |
          cd base-branch
          pnpm install --frozen-lockfile

      - name: Build base branch
        run: |
          cd base-branch
          pnpm --filter web build || echo "Base branch build failed — skipping comparison"
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          JWT_SECRET: mock_jwt_secret_for_build_verification_minimum_32_chars

      - name: Capture base bundle size
        id: base-size
        run: |
          if [ -d "base-branch/apps/web/.next" ]; then
            BASE_SIZE=$(du -sb base-branch/apps/web/.next | cut -f1)
            echo "size=$BASE_SIZE" >> $GITHUB_OUTPUT
          else
            echo "size=0" >> $GITHUB_OUTPUT
          fi

      - name: Compare and comment bundle sizes
        uses: actions/github-script@v7
        with:
          script: |
            const prSize   = parseInt('${{ steps.pr-size.outputs.size }}') || 0;
            const baseSize = parseInt('${{ steps.base-size.outputs.size }}') || 0;

            const formatBytes = (bytes) => {
              if (bytes === 0) return 'N/A';
              const units = ['B', 'KB', 'MB', 'GB'];
              let size = bytes;
              let idx = 0;
              while (size >= 1024 && idx < units.length - 1) { size /= 1024; idx++; }
              return `${size.toFixed(2)} ${units[idx]}`;
            };

            const diff = prSize - baseSize;
            const diffPct = baseSize > 0 ? ((diff / baseSize) * 100).toFixed(2) : 'N/A';
            const diffStr = diff > 0
              ? `+${formatBytes(diff)} (+${diffPct}%)`
              : diff < 0
                ? `${formatBytes(diff)} (${diffPct}%)`
                : 'No change';

            const status = diff > 500000  ? '⚠️ Bundle increased by >500KB'
                         : diff > 1000000 ? '❌ Bundle increased by >1MB — requires review'
                         : '✅ Bundle size acceptable';

            const body = [
              '## Bundle Size Report',
              '',
              `| Branch | Size |`,
              `|--------|------|`,
              `| Base (${context.payload.pull_request.base.ref}) | ${formatBytes(baseSize)} |`,
              `| PR | ${formatBytes(prSize)} |`,
              `| **Diff** | **${diffStr}** |`,
              '',
              status,
            ].join('\n');

            // Update existing comment or create new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Bundle Size Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Fail if bundle increased by more than 2MB
            if (diff > 2000000) {
              core.setFailed(`Bundle size increased by ${formatBytes(diff)} — exceeds 2MB limit`);
            }

  # ============================================================================
  # TYPE COVERAGE CHECK
  # Ensure TypeScript coverage meets the minimum threshold
  # ============================================================================
  type-coverage:
    name: TypeScript Type Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check
        continue-on-error: false

      - name: Check for 'any' type usage
        run: |
          # Count explicit 'any' usages (warnings — not blocking)
          ANY_COUNT=$(grep -rn ': any' apps/web/src --include="*.ts" --include="*.tsx" | \
            grep -v "//.*: any" | \
            grep -v node_modules | \
            wc -l | tr -d ' ')
          echo "Explicit 'any' usages: $ANY_COUNT"

          if [ "$ANY_COUNT" -gt "50" ]; then
            echo "::warning::High number of 'any' type usages ($ANY_COUNT). Consider adding explicit types."
          fi

          echo "### TypeScript Type Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript check: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Explicit \`any\` usages: $ANY_COUNT" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # PRISMA SCHEMA VALIDATION
  # ============================================================================
  prisma-validation:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @aura/database prisma validate
        env:
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock

      - name: Generate Prisma client (verify no drift)
        run: pnpm --filter @aura/database prisma generate
        env:
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock

      - name: Check for schema changes
        id: schema-changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | \
             grep -q 'packages/@aura/database/prisma/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Prisma schema files changed in this PR"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No Prisma schema changes"
          fi

      - name: Report schema changes
        if: steps.schema-changed.outputs.changed == 'true'
        run: |
          echo "### Prisma Schema Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following Prisma files were modified:" >> $GITHUB_STEP_SUMMARY
          git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep 'packages/@aura/database/prisma/' | \
            while read f; do echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY; done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reviewer action required**: Verify migration is backwards-compatible." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # MIGRATION SAFETY CHECK
  # Warn about destructive migration operations
  # ============================================================================
  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prisma-validation
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new migrations
        id: new-migrations
        run: |
          NEW_MIGRATIONS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep 'packages/@aura/database/prisma/migrations/' | \
            grep '\.sql$' || true)

          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "migrations<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_MIGRATIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan for destructive operations
        if: steps.new-migrations.outputs.found == 'true'
        id: destructive-check
        run: |
          DESTRUCTIVE_FOUND=false
          WARNINGS=""

          while IFS= read -r migration; do
            if [ -f "$migration" ]; then
              # Check for DROP TABLE (most destructive)
              if grep -qi 'DROP TABLE' "$migration"; then
                DESTRUCTIVE_FOUND=true
                WARNINGS="$WARNINGS\n- **DROP TABLE** found in \`$migration\`"
              fi

              # Check for DROP COLUMN
              if grep -qi 'DROP COLUMN' "$migration"; then
                DESTRUCTIVE_FOUND=true
                WARNINGS="$WARNINGS\n- **DROP COLUMN** found in \`$migration\`"
              fi

              # Check for NOT NULL without DEFAULT (can fail on existing data)
              if grep -qi 'NOT NULL' "$migration" && ! grep -qi 'DEFAULT' "$migration"; then
                WARNINGS="$WARNINGS\n- NOT NULL without DEFAULT in \`$migration\` — may fail on non-empty tables"
              fi

              # Check for RENAME COLUMN / RENAME TABLE (can break existing queries)
              if grep -qi 'RENAME' "$migration"; then
                WARNINGS="$WARNINGS\n- **RENAME** operation in \`$migration\` — ensure all consumers are updated"
              fi
            fi
          done <<< "${{ steps.new-migrations.outputs.migrations }}"

          if [ "$DESTRUCTIVE_FOUND" = "true" ]; then
            echo "::error::Destructive migration operations detected. See PR comment for details."
          fi

          echo "destructive=$DESTRUCTIVE_FOUND" >> $GITHUB_OUTPUT
          echo "warnings<<EOF" >> $GITHUB_OUTPUT
          printf "$WARNINGS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment migration safety report
        if: steps.new-migrations.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const destructive = '${{ steps.destructive-check.outputs.destructive }}' === 'true';
            const warnings = `${{ steps.destructive-check.outputs.warnings }}`;
            const migrations = `${{ steps.new-migrations.outputs.migrations }}`;

            const statusIcon = destructive ? '❌' : '⚠️';
            const statusText = destructive
              ? 'Destructive operations detected — manual review required'
              : 'Non-destructive migration — review recommended';

            const body = [
              '## Database Migration Safety Report',
              '',
              `${statusIcon} **${statusText}**`,
              '',
              '### New Migrations',
              migrations.split('\n').filter(Boolean).map(m => `- \`${m}\``).join('\n'),
              '',
              warnings ? '### Warnings' : '',
              warnings || '',
              '',
              '### Checklist for Reviewer',
              '- [ ] Migration is backwards-compatible (old app can run with new schema)',
              '- [ ] Migration is forwards-compatible (new app can run with old schema)',
              '- [ ] Large table migrations use batching or background jobs',
              '- [ ] Destructive changes are annotated with `-- SAFE TO DROP:` comment',
              '- [ ] Rollback plan is documented if migration cannot be reverted',
            ].filter(Boolean).join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Database Migration Safety Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (destructive) {
              core.setFailed('Destructive migration operations require explicit approval');
            }

  # ============================================================================
  # PR CHECKS SUMMARY
  # ============================================================================
  pr-checks-summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [bundle-size, type-coverage, prisma-validation, migration-safety]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## PR Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Size | ${{ needs.bundle-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Coverage | ${{ needs.type-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prisma Validation | ${{ needs.prisma-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Safety | ${{ needs.migration-safety.result }} |" >> $GITHUB_STEP_SUMMARY
