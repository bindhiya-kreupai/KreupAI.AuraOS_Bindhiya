name: Security Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggers

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --prod
        continue-on-error: true

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
        if: ${{ secrets.SNYK_TOKEN != '' }}

      - name: Run Snyk test
        run: snyk test --all-projects --severity-threshold=high
        continue-on-error: true
        if: ${{ secrets.SNYK_TOKEN != '' }}

      - name: Run Snyk Code (SAST)
        run: snyk code test --severity-threshold=high
        continue-on-error: true
        if: ${{ secrets.SNYK_TOKEN != '' }}

      - name: Run Snyk monitor
        run: snyk monitor --all-projects
        if: github.ref == 'refs/heads/main' && secrets.SNYK_TOKEN != ''

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        if: always() && secrets.SNYK_TOKEN != ''
        with:
          sarif_file: snyk.sarif

  sql-injection-tests:
    name: SQL Injection Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/checkout@v3
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database
        run: |
          pnpm prisma generate
          pnpm prisma db push
          pnpm prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraos_test

      - name: Start application
        run: |
          pnpm dev &
          sleep 30
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraos_test

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run SQL injection tests
        run: npx playwright test apps/web/src/__tests__/security/sql-injection.test.ts
        env:
          API_URL: http://localhost:3006/api/v1

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: sql-injection-results
          path: |
            playwright-report/
            test-results/

  xss-tests:
    name: XSS Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database
        run: |
          pnpm prisma generate
          pnpm prisma db push
          pnpm prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraos_test

      - name: Start application
        run: |
          pnpm dev &
          sleep 30
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraos_test

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run XSS tests
        run: npx playwright test apps/web/src/__tests__/security/xss.test.ts
        env:
          API_URL: http://localhost:3006/api/v1
          BASE_URL: http://localhost:3006

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: xss-test-results
          path: |
            playwright-report/
            test-results/

  owasp-zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database
        run: |
          pnpm prisma generate
          pnpm prisma db push
          pnpm prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraos_test

      - name: Start application
        run: |
          pnpm dev &
          sleep 30
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraos_test

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:3006'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, sql-injection-tests, xss-tests, owasp-zap-scan]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate security summary
        run: |
          echo "# Security Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SQL Injection Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ XSS Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OWASP ZAP Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review individual test artifacts for detailed results." >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🔒 Security Tests Complete\n\nAll security tests have been executed. Please review the artifacts for detailed results.\n\n- Dependency Scan\n- SQL Injection Tests\n- XSS Tests\n- OWASP ZAP Scan'
            })
