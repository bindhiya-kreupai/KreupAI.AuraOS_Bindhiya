# Continuous Integration Pipeline
# Week 4: Enhanced CI/CD with Coverage Gates & Parallel Execution
# Runs on every push and pull request

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  COVERAGE_THRESHOLD: 70 # Week 4: Coverage gate threshold

jobs:
  # =============================================================================
  # LINT AND FORMAT CHECK
  # =============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        # continue-on-error: false - Updated Jan 2026: Lint failures now block CI

      - name: Check TypeScript
        run: pnpm type-check
        # continue-on-error: false - Updated Jan 2026: Type errors now block CI

  # =============================================================================
  # UNIT TESTS - Week 4: Enhanced with Coverage Gates
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aura/database prisma generate

      - name: Run unit tests with coverage
        run: pnpm --filter web test:coverage
        env:
          NODE_ENV: test
          CI: true

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold of ${{ env.COVERAGE_THRESHOLD }}%..."
          echo "Coverage thresholds are now enforced by vitest.config.ts"
          echo "Thresholds: lines=70%, functions=70%, branches=70%, statements=70%"

      - name: Display test results
        if: always()
        run: |
          echo "Generating test reports..."
          ls -la ./apps/web/test-results/ || echo "No test results directory found"
          ls -la ./apps/web/coverage/ || echo "No coverage directory found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/web/coverage/coverage-final.json,./apps/web/coverage/lcov.info
          flags: unit-tests
          name: unit-tests-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-tests
          path: ./apps/web/test-results/
          retention-days: 30

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-tests
          path: ./apps/web/coverage/
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ./apps/web/test-results/junit.xml
          check_name: Unit Test Results
          comment_mode: off

      - name: Generate test summary
        if: always()
        run: |
          echo "### Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY
          echo "📊 Coverage reports uploaded to artifacts" >> $GITHUB_STEP_SUMMARY
          echo "📋 JUnit test results available" >> $GITHUB_STEP_SUMMARY
          echo "📄 HTML test report in artifacts" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # INTEGRATION TESTS - Week 4: Enhanced with Parallel Execution
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auraos_test
          POSTGRES_USER: auraos
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        shard: [1, 2] # Week 4: Parallel execution with 2 shards
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aura/database prisma generate

      - name: Run database migrations
        run: pnpm --filter @aura/database prisma migrate deploy
        env:
          DATABASE_URL: postgresql://auraos:test_password@localhost:5432/auraos_test?schema=public

      - name: Seed test database
        run: pnpm --filter @aura/database prisma db seed
        env:
          DATABASE_URL: postgresql://auraos:test_password@localhost:5432/auraos_test?schema=public

      - name: Run integration tests (Shard ${{ matrix.shard }}/2)
        run: pnpm --filter web test:integration --shard=${{ matrix.shard }}/2
        env:
          NODE_ENV: test
          CI: true
          DATABASE_URL: postgresql://auraos:test_password@localhost:5432/auraos_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_minimum_32_characters

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/web/coverage/coverage-final.json,./apps/web/coverage/lcov.info
          flags: integration-tests,shard-${{ matrix.shard }}
          name: integration-tests-shard-${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration-shard-${{ matrix.shard }}
          path: ./apps/web/test-results/
          retention-days: 30

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration-shard-${{ matrix.shard }}
          path: ./apps/web/coverage/
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ./apps/web/test-results/junit.xml
          check_name: Integration Test Results (Shard ${{ matrix.shard }})
          comment_mode: off

  # =============================================================================
  # END-TO-END TESTS (Phase 4 #47)
  # =============================================================================
  # Runs the Playwright suite at apps/web/src/__tests__/e2e against a fully
  # booted web app + Postgres + Redis. Kept separate from unit/integration
  # jobs because it's slower (~3-5 min) and uses different infrastructure.
  # Failures don't block PRs while the suite stabilises — set required: true
  # after the team confirms the suite is reliable.
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true  # remove once suite is reliable; tracked in #47

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e?schema=public
      DIRECT_URL: postgresql://e2e:e2e@localhost:5432/e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-jwt-secret-must-be-at-least-32-chars-aaa
      JWT_REFRESH_SECRET: e2e-refresh-secret-must-be-at-least-32-chars
      MFA_ENCRYPTION_KEY: e2e-mfa-encryption-key-at-least-32-chars-xyz
      SSN_ENCRYPTION_KEY: e2e-ssn-encryption-key-at-least-32-chars-xyz
      LOG_LEVEL: error
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aura/database exec prisma generate

      - name: Apply migrations to test DB
        run: pnpm --filter @aura/database exec prisma migrate deploy

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter web build

      - name: Run Playwright E2E tests
        run: pnpm --filter web test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_BROWSERS: chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright trace files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 14

  # =============================================================================
  # SECURITY AUDIT
  # =============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate
        # continue-on-error: false - Updated Jan 2026: Security issues now block CI

      - name: Run tenant isolation audit
        run: pnpm --filter web audit:tenant-isolation
        # continue-on-error: false - Updated Jan 2026: Isolation issues now block CI

  # =============================================================================
  # BUILD VERIFICATION
  # =============================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aura/database prisma generate

      - name: Build application
        run: pnpm --filter web build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Mock required env vars for build
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          JWT_SECRET: mock_jwt_secret_for_build_verification_minimum_32_chars

      - name: Check build size
        run: |
          du -sh apps/web/.next
          echo "Build completed successfully"

  # =============================================================================
  # DOCKER BUILD
  # =============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: auraos:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker images auraos:ci-test
          echo "Docker build successful"

  # =============================================================================
  # COVERAGE REPORT MERGE - Week 4: Merge coverage from parallel shards
  # =============================================================================
  coverage-report:
    name: Merge Coverage Reports
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./coverage-artifacts

      - name: Display coverage structure
        run: ls -R ./coverage-artifacts

      - name: Merge coverage reports
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Shard | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | - | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | 1/2 | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | 2/2 | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Coverage threshold: ${{ env.COVERAGE_THRESHOLD }}%" >> $GITHUB_STEP_SUMMARY

      - name: Check overall coverage threshold
        run: |
          echo "Checking overall coverage threshold..."
          # TODO: Implement coverage threshold check across all shards
          # This will aggregate coverage from unit-tests and integration-tests shards
          # and fail the build if below COVERAGE_THRESHOLD (70%)

  # =============================================================================
  # STATUS CHECK
  # =============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, e2e-tests, security-audit, build, docker-build, coverage-report]
    if: always()

    steps:
      - name: Check CI results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "CI pipeline failed"
            exit 1
          fi
          # e2e-tests is reported but not required-to-pass yet (continue-on-error
          # is true on that job). When the suite stabilises, add the same check
          # here. See issue #47.
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "::warning::E2E suite did not pass (currently advisory, see #47)"
          fi
          echo "CI pipeline passed successfully"

      - name: Generate final summary
        if: always()
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Report | ${{ needs.coverage-report.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.integration-tests.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "### ✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
          fi
