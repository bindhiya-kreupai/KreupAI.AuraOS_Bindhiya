---
# AuraOS RabbitMQ StatefulSet
# Production-grade with management plugin, persistence, and peer discovery

apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: aura-system
  labels:
    app: rabbitmq
data:
  rabbitmq.conf: |
    ## Clustering
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.node_cleanup.interval = 30
    cluster_formation.node_cleanup.only_log_warning = true
    cluster_partition_handling = autoheal

    ## Networking
    listeners.tcp.default = 5672
    management.tcp.port = 15672

    ## Message persistence defaults
    queue_master_locator = min-masters

    ## Memory / disk alarms
    vm_memory_high_watermark.relative = 0.7
    disk_free_limit.relative = 2.0

    ## Logging
    log.console = true
    log.console.level = info

    ## Default user — override via env
    default_vhost = aura
    default_user = aura_admin

  enabled_plugins: |
    [rabbitmq_management, rabbitmq_peer_discovery_k8s, rabbitmq_prometheus].

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: aura-system
  labels:
    app: rabbitmq

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: aura-system
rules:
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: aura-system
subjects:
  - kind: ServiceAccount
    name: rabbitmq
    namespace: aura-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: aura-system
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: aura-system
spec:
  serviceName: rabbitmq
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rabbitmq
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      terminationGracePeriodSeconds: 120

      initContainers:
        - name: set-erlang-cookie
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /var/run/secrets/erlang-cookie/.erlang.cookie /var/lib/rabbitmq/.erlang.cookie
              chmod 400 /var/lib/rabbitmq/.erlang.cookie
          volumeMounts:
            - name: erlang-cookie
              mountPath: /var/run/secrets/erlang-cookie
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
            - name: prometheus
              containerPort: 15692
              protocol: TCP
            - name: clustering
              containerPort: 25672
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false

          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_DEFAULT_VHOST
              value: "aura"
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: RABBITMQ_PASSWORD
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(MY_POD_NAME).rabbitmq.$(MY_POD_NAMESPACE).svc.cluster.local"

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins

      volumes:
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
        - name: erlang-cookie
          secret:
            secretName: aura-secrets
            items:
              - key: RABBITMQ_PASSWORD
                path: .erlang.cookie

  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
        labels:
          app: rabbitmq
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 20Gi

---
# Headless service for StatefulSet peer discovery
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: aura-system
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: clustering
      port: 25672
      targetPort: 25672

---
# LoadBalanced service for AMQP clients
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-client
  namespace: aura-system
  labels:
    app: rabbitmq
    role: client
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
