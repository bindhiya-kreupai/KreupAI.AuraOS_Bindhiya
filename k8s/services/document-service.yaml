---
# AuraOS Document Microservice
# Deployment + ClusterIP Service
# Port: 4004

apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: aura-system
  labels:
    app: document-service
    app.kubernetes.io/name: document-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: aura-system
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: document-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: document-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4004"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: document-service

      containers:
        - name: document-service
          image: kreupai/aura-document-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4004
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: aura-config
            - secretRef:
                name: aura-secrets

          env:
            - name: SERVICE_NAME
              value: "document-service"
            - name: PORT
              value: "4004"
            - name: NODE_ENV
              value: "production"
            - name: STORAGE_PROVIDER
              value: "s3"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /readyz
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /healthz
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: upload-staging
              mountPath: /app/uploads

      volumes:
        - name: tmp
          emptyDir: {}
        - name: upload-staging
          emptyDir:
            sizeLimit: "500Mi"

      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: aura-system
  labels:
    app: document-service
    app.kubernetes.io/name: document-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: aura-system
spec:
  type: ClusterIP
  selector:
    app: document-service
  ports:
    - name: http
      port: 4004
      targetPort: 4004
      protocol: TCP
