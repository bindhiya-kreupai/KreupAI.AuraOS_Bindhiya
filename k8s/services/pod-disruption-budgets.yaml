---
# PodDisruptionBudgets for all AuraOS services
#
# Why: a PDB tells k8s how many pods MUST remain available during voluntary
# disruptions (node drains, cluster autoscaling, manual evictions). Without
# one, draining a node can take an entire service offline if all its replicas
# happen to land there. The k8s audit (Phase 3 #40) flagged this for every
# service deployment.
#
# Sizing convention used here:
#   - Stateless services that already have replicas >= 2: minAvailable = 1
#     (guarantees at least one pod stays up during voluntary disruption)
#   - The web app uses minAvailable = 2 because the HPA can scale it up and
#     having both web pods drain together would cause a visible outage
#
# All PDBs in the aura-system namespace.

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aura-web-pdb
  namespace: aura-system
  labels:
    app: aura-web
    app.kubernetes.io/part-of: aura-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aura-web

