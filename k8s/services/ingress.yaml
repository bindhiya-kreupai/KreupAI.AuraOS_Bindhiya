---
# AuraOS Nginx Ingress Controller
# TLS termination, rate limiting, path-based routing

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aura-ingress
  namespace: aura-system
  labels:
    app.kubernetes.io/name: aura-ingress
    app.kubernetes.io/part-of: aura-system
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"

    # TLS / HTTPS enforcement
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"

    # Rate limiting — general API
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "1000"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.aura-hcm.com; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Request body size
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"

    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

    # Cert-manager TLS certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  tls:
    - hosts:
        - app.aura-hcm.com
        - admin.aura-hcm.com
        - api.aura-hcm.com
      secretName: aura-tls-secret

  rules:
    # Main web application
    - host: app.aura-hcm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aura-web
                port:
                  number: 80

    # Admin portal
    - host: admin.aura-hcm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aura-web
                port:
                  number: 80

    # API gateway routing
    - host: api.aura-hcm.com
      http:
        paths:
          - path: /v1/payroll
            pathType: Prefix
            backend:
              service:
                name: payroll-service
                port:
                  number: 3001

          - path: /v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3002

          - path: /
            pathType: Prefix
            backend:
              service:
                name: aura-web
                port:
                  number: 80

---
# Rate-limiting Ingress for auth endpoints (stricter limits)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aura-auth-ingress
  namespace: aura-system
  labels:
    app.kubernetes.io/name: aura-auth-ingress
    app.kubernetes.io/part-of: aura-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Strict rate limiting for auth paths
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "60"

    # Block common brute force patterns
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Robots-Tag "noindex, nofollow" always;

spec:
  tls:
    - hosts:
        - app.aura-hcm.com
      secretName: aura-tls-secret
  rules:
    - host: app.aura-hcm.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: aura-web
                port:
                  number: 80
