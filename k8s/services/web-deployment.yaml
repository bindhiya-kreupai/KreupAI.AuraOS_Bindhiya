---
# AuraOS Web Application (Next.js 14)
# Deployment + Service + HorizontalPodAutoscaler

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-web
  namespace: aura-system
  labels:
    app: aura-web
    app.kubernetes.io/name: aura-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aura-system
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aura-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: aura-web
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # Ensure pods spread across nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: aura-web

      containers:
        - name: aura-web
          image: kreupai/aura-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          # Environment from ConfigMap and Secrets
          envFrom:
            - configMapRef:
                name: aura-config
            - secretRef:
                name: aura-secrets

          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # Resource limits (production sizing)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          # Startup probe — allow 90s for Next.js cold start.
          # Uses /api/healthz (liveness endpoint) so the probe succeeds the
          # moment the process is serving HTTP, regardless of dep state.
          startupProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 18
            successThreshold: 1

          # Liveness — never depends on external systems (#42).
          # If this fails repeatedly, k8s will restart the pod.
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Readiness — full dep check; pulls pod out of LB if Postgres/Redis down.
          # See /api/readyz handler for the critical-vs-non-critical split.
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir:
            sizeLimit: 1Gi

      terminationGracePeriodSeconds: 30

      # Image pull secret (if using private registry)
      # imagePullSecrets:
      #   - name: kreupai-registry

---
apiVersion: v1
kind: Service
metadata:
  name: aura-web
  namespace: aura-system
  labels:
    app: aura-web
    app.kubernetes.io/name: aura-web
spec:
  type: ClusterIP
  selector:
    app: aura-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
# Horizontal Pod Autoscaler for web app
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aura-web-hpa
  namespace: aura-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aura-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
