---
# AuraOS Analytics Microservice
# Deployment + ClusterIP Service
# Port: 4005
# Single replica — horizontally scalable but analytics workloads are memory-intensive

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: aura-system
  labels:
    app: analytics-service
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: aura-system
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: analytics-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: analytics-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4005"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: analytics-service
          image: kreupai/aura-analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4005
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: aura-config
            - secretRef:
                name: aura-secrets

          env:
            - name: SERVICE_NAME
              value: "analytics-service"
            - name: PORT
              value: "4005"
            - name: NODE_ENV
              value: "production"
            - name: ANALYTICS_CACHE_TTL_SECONDS
              value: "300"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: report-cache
              mountPath: /app/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: report-cache
          emptyDir:
            sizeLimit: "1Gi"

      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: aura-system
  labels:
    app: analytics-service
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: aura-system
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 4005
      targetPort: 4005
      protocol: TCP
