---
# AuraOS Secrets Template
# IMPORTANT: Replace all placeholder values before deploying.
# In production, use a secrets manager (HashiCorp Vault / AWS Secrets Manager)
# and inject secrets via the External Secrets Operator or similar.
#
# Values below are base64-encoded placeholders only.
# Generate real values with: echo -n 'your-secret' | base64
apiVersion: v1
kind: Secret
metadata:
  name: aura-secrets
  namespace: aura-system
  labels:
    app.kubernetes.io/name: aura-secrets
    app.kubernetes.io/part-of: aura-system
  annotations:
    # Rotate every 90 days
    secret-rotation-schedule: "0 0 1 */3 *"
type: Opaque
data:
  # Database credentials
  # Placeholder: echo -n 'REPLACE_ME_DB_PASSWORD' | base64
  DB_PASSWORD: UkVQTEFDRV9NRV9EQl9QQVNTV09SRA==

  # JWT & session secrets (minimum 32 chars, use openssl rand -base64 64)
  # Placeholder: echo -n 'REPLACE_ME_JWT_SECRET_MIN_32_CHARS' | base64
  JWT_SECRET: UkVQTEFDRV9NRV9KV1RfU0VDUkVUX01JTl8zMl9DSEFSUw==

  # Placeholder: echo -n 'REPLACE_ME_SESSION_SECRET' | base64
  SESSION_SECRET: UkVQTEFDRV9NRV9TRVNTSU9OX1NFQ1JFVA==

  # Redis auth
  # Placeholder: echo -n 'REPLACE_ME_REDIS_PASSWORD' | base64
  REDIS_PASSWORD: UkVQTEFDRV9NRV9SRURJU19QQVNTV09SRA==

  # RabbitMQ credentials
  # Placeholder: echo -n 'REPLACE_ME_RABBITMQ_USER' | base64
  RABBITMQ_USER: UkVQTEFDRV9NRV9SQUJCSVRNUVBfVVNFUg==
  # Placeholder: echo -n 'REPLACE_ME_RABBITMQ_PASSWORD' | base64
  RABBITMQ_PASSWORD: UkVQTEFDRV9NRV9SQUJCSVRNUVBfUEFTU1dPUkQ=

  # AWS credentials (for S3, SSM)
  # Placeholder: echo -n 'REPLACE_ME_AWS_ACCESS_KEY_ID' | base64
  AWS_ACCESS_KEY_ID: UkVQTEFDRV9NRV9BV1NfQUNDRVNTX0tFWV9JRA==
  # Placeholder: echo -n 'REPLACE_ME_AWS_SECRET_ACCESS_KEY' | base64
  AWS_SECRET_ACCESS_KEY: UkVQTEFDRV9NRV9BV1NfU0VDUkVUX0FDQ0VTU19LRVk=

  # Encryption keys (AES-256 — must be exactly 32 bytes)
  # Placeholder: openssl rand -base64 32 | base64
  ENCRYPTION_KEY: UkVQTEFDRV9NRV9FTkNSWVBUSU9OX0tFWV8zMkJZVEVT

  # External API keys
  # Placeholder: echo -n 'REPLACE_ME_SENDGRID_API_KEY' | base64
  SENDGRID_API_KEY: UkVQTEFDRV9NRV9TRU5ER1JJRF9BUElfS0VZ
  # Placeholder: echo -n 'REPLACE_ME_TWILIO_AUTH_TOKEN' | base64
  TWILIO_AUTH_TOKEN: UkVQTEFDRV9NRV9UV0lMSU9fQVVUSF9UT0tFTg==
  # Placeholder: echo -n 'REPLACE_ME_STRIPE_SECRET_KEY' | base64
  STRIPE_SECRET_KEY: UkVQTEFDRV9NRV9TVFJJUEVFU0VDUkVUX0tFWQ==

  # HashiCorp Vault token (if using Vault for secret rotation)
  # Placeholder: echo -n 'REPLACE_ME_VAULT_TOKEN' | base64
  VAULT_TOKEN: UkVQTEFDRV9NRV9WQVVMVF9UT0tFTg==
