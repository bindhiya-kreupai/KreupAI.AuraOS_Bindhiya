# Docker Compose for AuraOS Development and Production
version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: auraos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auraos}
      POSTGRES_USER: ${POSTGRES_USER:-auraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auraos_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auraos} -d ${POSTGRES_DB:-auraos}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auraos-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: auraos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auraos-network

  # AuraOS Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: auraos-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraos}:${POSTGRES_PASSWORD:-auraos_password}@postgres:5432/${POSTGRES_DB:-auraos}?schema=public

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}

      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}

      # Feature Flags
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      ENABLE_MFA: ${ENABLE_MFA:-true}
      ENABLE_SSO: ${ENABLE_SSO:-false}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}

      # Monitoring (Optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

      # Startup Options
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DATABASE: ${SEED_DATABASE:-false}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Mount for development hot-reload (comment out in production)
      # - ./apps/web:/app/apps/web
      # - /app/apps/web/node_modules
      # - /app/apps/web/.next

      # Logs
      - web_logs:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - auraos-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auraos-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraos}:${POSTGRES_PASSWORD:-auraos_password}@postgres:5432/${POSTGRES_DB:-auraos}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"
      - "50051:50051"
    networks:
      - auraos-network

  # Employee Service
  employee-service:
    build:
      context: .
      dockerfile: services/employee-service/Dockerfile
    container_name: auraos-employee-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraos}:${POSTGRES_PASSWORD:-auraos_password}@postgres:5432/${POSTGRES_DB:-auraos}?schema=public
      PORT: 3002
    ports:
      - "3002:3002"
    networks:
      - auraos-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: auraos-notification-service
    restart: unless-stopped
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    networks:
      - auraos-network

  # Document Service
  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    container_name: auraos-document-service
    restart: unless-stopped
    environment:
      PORT: 3004
    ports:
      - "3004:3004"
    networks:
      - auraos-network

  # Payroll Service
  payroll-service:
    build:
      context: .
      dockerfile: services/payroll-service/Dockerfile
    container_name: auraos-payroll-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraos}:${POSTGRES_PASSWORD:-auraos_password}@postgres:5432/${POSTGRES_DB:-auraos}?schema=public
      PORT: 3005
    ports:
      - "3005:3005"
    networks:
      - auraos-network

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: auraos-analytics-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraos}:${POSTGRES_PASSWORD:-auraos_password}@postgres:5432/${POSTGRES_DB:-auraos}?schema=public
      PORT: 3007
    ports:
      - "3007:3007"
    networks:
      - auraos-network

  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: auraos-ai-service
    restart: unless-stopped
    environment:
      PORT: 3006
    ports:
      - "3006:3006"
    networks:
      - auraos-network

  # Integration Service
  integration-service:
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
    container_name: auraos-integration-service
    restart: unless-stopped
    environment:
      PORT: 3008
    ports:
      - "3008:3008"
    networks:
      - auraos-network

  # Scheduling Service
  scheduling-service:
    build:
      context: .
      dockerfile: services/scheduling-service/Dockerfile
    container_name: auraos-scheduling-service
    restart: unless-stopped
    environment:
      PORT: 3009
    ports:
      - "3009:3009"
    networks:
      - auraos-network

  # Workflow Service
  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    container_name: auraos-workflow-service
    restart: unless-stopped
    environment:
      PORT: 3010
    ports:
      - "3010:3010"
    networks:
      - auraos-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  web_logs:
    driver: local
  nginx_logs:
    driver: local
  pgadmin_data:
    driver: local

# Network
networks:
  auraos-network:
    driver: bridge
