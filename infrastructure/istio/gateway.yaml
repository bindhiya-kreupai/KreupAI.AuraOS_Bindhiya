apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: auraos-gateway
  namespace: auraos
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.auraos.com"
        - "auraos.com"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*.auraos.com"
        - "auraos.com"
      tls:
        mode: SIMPLE
        credentialName: auraos-tls-cert
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: auraos-routes
  namespace: auraos
spec:
  hosts:
    - "*.auraos.com"
    - "auraos.com"
  gateways:
    - auraos-gateway
  http:
    # Auth Service Routes (10% traffic initially)
    - match:
        - uri:
            prefix: /api/v1/auth/
      route:
        - destination:
            host: auth-service
            port:
              number: 3001
          weight: 10
        - destination:
            host: monolith
            port:
              number: 3006
          weight: 90
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
      timeout: 10s
      headers:
        request:
          add:
            x-request-source: istio-gateway
        response:
          add:
            x-served-by: auth-service

    # Default Route (Monolith)
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: monolith
            port:
              number: 3006
          weight: 100
      timeout: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service-destination
  namespace: auraos
spec:
  host: auth-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 40
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: monolith-destination
  namespace: auraos
spec:
  host: monolith
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: auraos
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: auth-service-policy
  namespace: auraos
spec:
  selector:
    matchLabels:
      app: auth-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/auraos/sa/kong
              - cluster.local/ns/auraos/sa/monolith
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            paths: ["/api/v1/auth/*", "/health", "/ready"]
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: auraos-telemetry
  namespace: auraos
spec:
  tracing:
    - providers:
        - name: datadog
      randomSamplingPercentage: 100.0
      customTags:
        environment:
          literal:
            value: production
        service:
          literal:
            value: auraos
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: ALL_METRICS
          tagOverrides:
            request_protocol:
              operation: UPSERT
              value: request.protocol
